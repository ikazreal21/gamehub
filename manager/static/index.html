<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameHub — Game Servers</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2" />
<link rel="stylesheet" href="/static/styles.css?v=2" />
<style>
.hero{max-width:900px;margin:32px auto 12px;padding:0 16px;text-align:center}
.hero h1{letter-spacing:3px;text-transform:uppercase}
.srv-grid{max-width:900px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.srv-grid{grid-template-columns:1fr}}
.srv-card h2{margin:0 0 4px;letter-spacing:1px;text-transform:uppercase;font-size:1.1em}
.addr-row{display:flex;gap:8px;margin:10px 0;align-items:stretch}
.addr-row code{flex:1;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:4px 14px;border:3px solid #120d08;border-radius:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:3px 3px 0 #000;font-size:.8em}
.pill.on{background:#6b8e4e;color:#fff8e8}
.pill.off{background:#b3402e;color:#fff8e8}
.plist{list-style:square;padding-left:22px;margin:6px 0;font-size:.9em}
.topbar{max-width:900px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="topbar">
  <span class="muted small">🎮 GAMEHUB</span>
  <a href="/admin"><button class="mini">Admin login</button></a>
</div>
<div class="hero">
  <div class="card">
    <h1>🎮 Game Servers</h1>
    <p class="muted">Live status, join addresses and players. Auto-refreshes every 15s.</p>
  </div>
</div>
<div class="srv-grid" id="grid"><div class="card"><p class="muted">Loading servers…</p></div></div>
<script>
async function load() {
  const grid = document.getElementById("grid");
  try {
    const r = await fetch("/public/servers");
    if (!r.ok) throw new Error("status " + r.status);
    const servers = await r.json();
    if (!servers.length) { grid.innerHTML = "<div class='card'><p class='muted'>No servers yet.</p></div>"; return; }
    grid.innerHTML = "";
    servers.forEach(s => {
      const d = document.createElement("div");
      d.className = "card srv-card";
      const players = (s.players || []).map(p => `<li>${p.name}</li>`).join("") || "<li class='muted'>No players online</li>";
      d.innerHTML = `<h2>${s.name}</h2>
        <p><span class="pill ${s.running ? "on" : "off"}">${s.running ? "● ONLINE" : "○ " + (s.state || "offline").toUpperCase()}</span>
        <span class="muted small"> ${s.game_name} · 👥 ${s.players_online ?? (s.players || []).length}</span></p>
        <div class="addr-row"><code>${s.public_address || "(address coming soon)"}</code></div>
        <ul class="plist">${players}</ul>
        <p><a href="/share/${s.id}"><button class="mini">Details</button></a></p>`;
      const code = d.querySelector("code");
      code.style.cursor = "pointer"; code.title = "Click to copy";
      code.onclick = () => { if (s.public_address) navigator.clipboard?.writeText(s.public_address); };
      grid.appendChild(d);
    });
  } catch (e) { grid.innerHTML = `<div class='card'><p class='error'>Couldn't load servers: ${e.message}</p></div>`; }
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
