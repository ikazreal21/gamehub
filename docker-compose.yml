# GameHub - self-hosted game server manager
# QUICK: ./setup-server.sh --admin-pass 'your-strong-pass' --with-playit
# MANUAL:
# 1. cp .env.example .env  -> edit passwords!
# 2. docker compose up -d --build
# 3. open http://<server-ip>:8000  (login admin / your ADMIN_PASS)
# CGNAT (PH ISPs): router port-forward won't work. Use playit agent
# (installed by setup-server.sh --with-playit) and tunnel 127.0.0.1:8211 + :27015.
services:
  manager:
    build: ./manager
    container_name: gamehub-manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # lets manager start/stop game containers
      - ./data:/data
      - ./backups:/backups
    env_file: .env
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      INSTANCES_FILE: /data/instances.json

  # Example Palworld server (also creatable from UI - this is just a pre-seed).
  # Comment out if you prefer creating everything from the UI.
